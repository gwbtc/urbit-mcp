name: Deploy to distribution ship
on:
  push:
    branches:
      - main

env:
  DESK:      mcp
  DIST_PIER: ${{ vars.SPONSOR_URBIT_ID_NO_TILDE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name:      sponsor
            screen:    sponsor
            user:      root
            ip:        ${{ vars.SPONSOR_IP }}
            pier_path: /root
            pier:      sponsor
            ssh_key:   SPONSOR_VPS_SSH_KEY
          - name:      daplyd
            screen:    daplyd
            user:      tyr
            ip:        ${{ vars.DAPLYD_IP }}
            pier_path: /home/tyr
            pier:      daplyd
            ssh_key:   SSH_DAPLYD
    name: deploy (${{ matrix.name }})
    env:
      SCREEN:    ${{ matrix.screen }}
      SHIP_IP:   ${{ matrix.ip }}
      SHIP_HOST: ${{ matrix.user }}@${{ matrix.ip }}
      PIER_PATH: ${{ matrix.pier_path }}
      PIER:      ${{ matrix.pier }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          cache-key: deploy-desk

      - name: Build desk
        run: zig build

      - name: Create desk.ship
        run: |
          printf '%s\n' "~${DIST_PIER}" > zig-out/desk.ship

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets[matrix.ssh_key] }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${SHIP_IP} >> ~/.ssh/known_hosts

      - name: Clear deployed desk
        run: ssh ${SHIP_HOST} "find ${PIER_PATH}/${PIER}/${DESK} -mindepth 1 -maxdepth 1 -exec rm -rf {} +"

      - name: Deploy desk
        run: |
          rsync -az --delete --exclude='.git*' \
            zig-out/ ${SHIP_HOST}:${PIER_PATH}/${PIER}/${DESK}/

      - name: Commit desk on ship
        run: |
          ssh ${SHIP_HOST} "screen -S ${SCREEN} -p 0 -X stuff $'|commit %${DESK}\r'"
